<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editorial desk | TrackFree</title><link rel="stylesheet" href="style.css"></head><body class="edu-page text-slate-800"><header class="edu-header"><nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"><a href="/" class="edu-brand"><span>TF</span> TrackFree</a><div class="text-sm font-medium"><a href="blog.html">View public journal →</a></div></nav></header><main class="admin-layout"><div><p class="kicker">Editorial desk</p><h1 class="edu-heading">Write, review, then publish.</h1><p class="edu-copy">A post stays private until its status is set to Published. Include primary sources before submitting it for review.</p></div><section id="admin-login" class="admin-card"><label class="guide-label" for="admin-token">Editor token</label><div class="mt-3 flex gap-2"><input id="admin-token" class="guide-input" type="password" autocomplete="off" placeholder="Token from ADMIN_API_TOKEN"><button id="connect-admin" class="primary-button">Open desk</button></div><p id="admin-message" role="status" class="mt-3 text-sm text-slate-600"></p></section><section id="editor" class="hidden admin-grid"><form id="post-form" class="admin-card"><input id="post-id" type="hidden"><label>Title<input id="post-title" required maxlength="160"></label><label>Category<input id="post-category" required maxlength="80" placeholder="Explainer, privacy news, practical guide…"></label><label>Author<input id="post-author" maxlength="120" value="TrackFree Editorial Team"></label><label>Summary<textarea id="post-summary" required maxlength="320" rows="3"></textarea></label><label>Article body<input class="sr-only" aria-hidden="true"><textarea id="post-body" required maxlength="30000" rows="12" placeholder="Write in plain text. Paragraphs are separated by a blank line."></textarea></label><label>Sources<textarea id="post-sources" rows="4" placeholder="Source label | https://official-source.example&#10;Another source | https://example.org"></textarea><small>One official HTTPS source per line.</small></label><label>Status<select id="post-status"><option value="draft">Draft</option><option value="in_review">In review</option><option value="published">Published</option></select></label><div class="mt-5 flex gap-3"><button class="primary-button" type="submit">Save post</button><button id="new-post" class="secondary-button" type="button">New draft</button></div></form><aside class="admin-card"><p class="note-label">Editorial queue</p><div id="admin-posts" class="editor-queue"></div></aside></section></main><script src="admin.js"></script></body></html>
